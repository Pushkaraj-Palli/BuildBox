name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://buildbox:buildbox@localhost:5432/buildbox?schema=public
      AUTH_SECRET: ci-only-placeholder-secret
      GEMINI_API_KEY: ci-only-placeholder-key
      GEMINI_MODEL: gemini-3.5-flash-lite

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildbox
          POSTGRES_PASSWORD: buildbox
          POSTGRES_DB: buildbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildbox -d buildbox"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:migrate:deploy

      - name: Build application
        run: npm run build
